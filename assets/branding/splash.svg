<svg xmlns="http://www.w3.org/2000/svg" width="560" height="320" viewBox="0 0 560 320" role="img" aria-label="Nova Office splash (placeholder)">
  <title>Nova Office — splash screen (placeholder)</title>
  <!-- PLACEHOLDER. Replaces vcl intro.png. Nova materials/thick tone. A real
       build renders the version string bottom-right at runtime. -->
  <defs>
    <linearGradient id="s-bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#181D27"/>
      <stop offset="1" stop-color="#12151C"/>
    </linearGradient>
    <linearGradient id="s-mark" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#8A8AFF"/>
      <stop offset="1" stop-color="#5B5BF0"/>
    </linearGradient>
  </defs>
  <rect width="560" height="320" rx="16" fill="url(#s-bg)"/>
  <path fill="url(#s-mark)" transform="translate(220 70) scale(1.5)" d="
    M48 8 C52 30 66 44 88 48 C66 52 52 66 48 88 C44 66 30 52 8 48 C30 44 44 30 48 8 Z"/>
  <circle cx="280" cy="130" r="9" fill="#fff"/>
  <text x="280" y="250" text-anchor="middle" fill="#F4F4F8"
        font-family="-apple-system, 'Segoe UI', Inter, Roboto, sans-serif"
        font-size="30" font-weight="600" letter-spacing="-0.5">Nova Office</text>
  <text x="280" y="278" text-anchor="middle" fill="#8A8AA8"
        font-family="-apple-system, 'Segoe UI', Inter, Roboto, sans-serif"
        font-size="13">Starting…</text>
  <text x="536" y="300" text-anchor="end" fill="#5A5A78"
        font-family="-apple-system, 'Segoe UI', Inter, Roboto, sans-serif"
        font-size="12">{{VERSION}}</text>
</svg>
