# Nova Office — release build (beta / stable channels).
#   ./autogen.sh --with-distro=NovaOffice --with-distro=NovaOffice-release

--enable-release-build
--disable-debug
--enable-optimized
--enable-lto                     # needs ~16 GB RAM at link
--enable-breakpad                # opt-in crash reporting (Phase 16)
--disable-assert-always-abort
--enable-symbols=yes             # kept for symbolication, stripped into a separate bundle
# Signing / notarization happens after the build — see docs/release.md.
