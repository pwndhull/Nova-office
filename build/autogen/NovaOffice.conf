# Nova Office — default distro configuration (Linux / macOS).
#
# Usage in the downstream fork:   ./autogen.sh --with-distro=NovaOffice
# One configure switch per line. Keep this minimal; layer debug/release on top
# with NovaOffice-debug.conf / NovaOffice-release.conf.

# --- Branding -------------------------------------------------------------
# No LibreOffice / TDF marks in any product surface. See docs/licensing.md.
--with-vendor=Nova Office
--with-privacy-policy-url=https://novaoffice.example/privacy
--without-branding-intro
--disable-fetch-external
--with-theme=nova colibre

# --- Rendering ----------------------------------------------------------
# Nova's materials, blur and animated overlays assume the Skia backend.
--enable-skia
--enable-gtk3
--enable-gtk4

# --- The Nova UI module (fork-only) -----------------------------------
--enable-nova-ui

# --- Scope --------------------------------------------------------------
# Keep the format engine and filters; trim what Nova does not ship yet.
--enable-release-build=no
--disable-online-update          # Nova ships its own opt-in updater (Phase 16)
--disable-breakpad               # enabled per-channel in release config
--without-java                   # drop the JVM by default; re-enable for Base
--disable-firebird-sdbc
--enable-python=internal

# --- Compatibility guarantee -----------------------------------------
# Do NOT disable these — they are the DOCX/XLSX/PPTX/ODF round-trip.
--enable-filters=all
