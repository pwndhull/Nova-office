# Nova Office — Windows (MSVC) default.
#   ./autogen.sh --with-distro=NovaOfficeWin

--with-vendor=Nova Office
--without-branding-intro
--with-theme=nova colibre

--enable-skia
--enable-nova-ui

--disable-online-update
--without-java
--disable-firebird-sdbc
--enable-python=internal
--enable-filters=all

# Windows toolchain
--with-visual-studio=2022
--enable-windows-build-signing=no   # signing is a post-build step (docs/release.md)
--with-package-format=msi
