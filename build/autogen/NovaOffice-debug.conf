# Nova Office — developer debug build.
#   ./autogen.sh --with-distro=NovaOffice --with-distro=NovaOffice-debug
# (or copy both into a single distro-config downstream)

--enable-debug
--enable-dbgutil
--enable-assert-always-abort
--enable-sal-log
--disable-optimized
--enable-ccache
--enable-symbols
# Compiler plugins (loplugin) run as part of `make check`.
--enable-compiler-plugins
