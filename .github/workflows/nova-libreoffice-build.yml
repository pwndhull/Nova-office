# SPDX-License-Identifier: MPL-2.0
#
# Full Nova-Office build (pinned LibreOffice + Nova patches + branding) on a
# free GitHub-hosted runner.
#
# A cold LibreOffice build is ~4-6 h and does not fit the 6 h job limit, so this
# is designed to RESUME across runs: a persistent ccache means each run finishes
# far more compilation than the last, and 2-4 runs complete it. It re-triggers
# itself on a schedule and after each successful run until `instdir/` exists.
#
# Trigger manually:  gh workflow run nova-libreoffice-build.yml
# Watch:             gh run watch   (or the Actions tab)

name: Nova build (LibreOffice)

on:
  workflow_dispatch:
  schedule:
    - cron: "0 */6 * * *" # every 6 h — auto-resume from warm ccache
  push:
    branches: [main]
    paths:
      - ".github/build-trigger"        # touch this file to kick a build
      - ".github/workflows/nova-libreoffice-build.yml"

concurrency:
  group: nova-libreoffice-build
  cancel-in-progress: false

permissions:
  contents: write
  actions: write

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 350
    steps:
      - uses: actions/checkout@v4

      - name: Free up disk
        uses: jlumbroso/free-disk-space@main
        with:
          tool-cache: true
          large-packages: true
          docker-images: true
          swap-storage: false

      - run: df -h /

      - uses: actions/setup-node@v4
        with: { node-version: "22" }

      - name: Install build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            build-essential git ccache nasm gperf python3-dev zip unzip \
            autoconf automake libtool pkg-config gettext bison flex \
            libkrb5-dev libgtk-3-dev libgstreamer1.0-dev libgstreamer-plugins-base1.0-dev \
            libxrandr-dev libxinerama-dev libxrender-dev libxext-dev libx11-dev libxt-dev \
            libgl1-mesa-dev libglu1-mesa-dev libglm-dev \
            libxml2-dev libxslt1-dev libfontconfig1-dev libcairo2-dev \
            libcups2-dev libnss3-dev libavahi-client-dev libdbus-1-dev libgpgme-dev

      - name: Restore ccache
        uses: actions/cache@v4
        with:
          path: ~/.ccache
          key: lo-ccache-${{ github.run_id }}
          restore-keys: |
            lo-ccache-

      - name: Restore external tarballs (LibreOffice deps download)
        uses: actions/cache@v4
        with:
          path: ~/lo-tarballs
          key: lo-tarballs-${{ hashFiles('third_party/UPSTREAM_PIN') }}
          restore-keys: |
            lo-tarballs-

      - name: Configure ccache (large — this is what makes resume work)
        run: |
          mkdir -p ~/lo-tarballs
          ccache -M 8G
          ccache -o compression=true
          ccache -z

      - name: Fetch pinned LibreOffice
        run: ./scripts/bootstrap-upstream.sh

      - name: Apply Nova patches
        run: ./scripts/apply-patches.sh

      - name: Generators + configure
        run: |
          node scripts/build-tokens.mjs
          node scripts/gen-branding.mjs
          # low-memory, size-trimmed, CI-friendly flags
          # LTO is off by default; --without-lto is not a real flag.
          ./scripts/nova-autogen.sh \
            --disable-mergelibs --enable-ccache \
            --without-help --without-myspell-dicts \
            --with-parallelism=4 \
            --with-external-tar="$HOME/lo-tarballs"
          (cd third_party/libreoffice && ./autogen.sh)

      - name: Build (time-boxed; resumes next run)
        id: build
        run: |
          set -o pipefail
          cd third_party/libreoffice
          # `build` = build everything, no tests. `fetch` (external tarballs)
          # runs first — cached in ~/lo-tarballs. Time-boxed so ccache still saves.
          timeout 320m make build -j4 2>&1 | tail -n 6000 || echo "BUILD_INCOMPLETE=1" >> "$GITHUB_ENV"

      - run: ccache -s

      - name: Check result
        id: result
        run: |
          if [ -x third_party/libreoffice/instdir/program/soffice.bin ] || \
             ls third_party/libreoffice/instdir/*.app 2>/dev/null; then
            echo "done=true" >> "$GITHUB_OUTPUT"
            third_party/libreoffice/instdir/program/soffice.bin --version || true
          else
            echo "done=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Upload build log
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: build-log-${{ github.run_number }}
          path: third_party/libreoffice/workdir/**/*.log
          retention-days: 7
          if-no-files-found: ignore

      - name: Package + upload instdir
        if: steps.result.outputs.done == 'true'
        run: |
          cd third_party/libreoffice
          tar -C instdir -czf ../../nova-office-linux-x86_64.tar.gz .
      - name: Upload Nova-Office build
        if: steps.result.outputs.done == 'true'
        uses: actions/upload-artifact@v4
        with:
          name: nova-office-linux-x86_64
          path: nova-office-linux-x86_64.tar.gz
          retention-days: 14

      - name: Status + auto-resume
        if: always()
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -x
          DONE='${{ steps.result.outputs.done }}'
          CCACHE_STATS="$(ccache -s 2>/dev/null | sed -n '1,12p')"

          git config user.name "nova-build[bot]"
          git config user.email "nova-build@users.noreply.github.com"

          # Retry the whole read-modify-write so a concurrent push can't wedge us.
          # Only ever touches BUILD_STATUS.md + .github/build-{attempts,trigger},
          # which nothing else edits — so there are no content conflicts.
          for attempt in 1 2 3 4 5 6; do
            git fetch -q origin main
            git reset -q --hard origin/main

            ATT_FILE=.github/build-attempts
            ATT=$(cat "$ATT_FILE" 2>/dev/null | tr -dc 0-9); ATT=${ATT:-0}
            RESUME=""
            if [ "$DONE" = "true" ]; then
              echo 0 > "$ATT_FILE"
            elif [ "$ATT" -lt 20 ]; then
              ATT=$((ATT + 1)); echo "$ATT" > "$ATT_FILE"
              date -u "+resume attempt $ATT @ %Y-%m-%dT%H:%M:%SZ" > .github/build-trigger
              RESUME="yes"
            fi

            {
              echo "<!-- SPDX-License-Identifier: MPL-2.0 -->"
              echo "# Nova-Office LibreOffice build — status"
              echo
              echo "_Auto-updated by the \`Nova build (LibreOffice)\` workflow._"
              echo
              echo "- Last run: [#${{ github.run_number }}](${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }})"
              echo "- Finished: $(date -u '+%Y-%m-%d %H:%M UTC')"
              echo "- Build completed this run: **${DONE:-false}**"
              echo "- Resume attempts used: ${ATT}/20"
              echo
              echo '```'
              echo "${CCACHE_STATS}"
              echo '```'
              if [ "$DONE" = "true" ]; then
                echo
                echo "✅ **Build complete.** Artifact \`nova-office-linux-x86_64\` on that run."
              elif [ -n "$RESUME" ]; then
                echo
                echo "⏳ Not finished — the next run auto-starts from the warm ccache."
              else
                echo
                echo "> ⚠️ 20 resume attempts without completion — needs a human look."
              fi
            } > BUILD_STATUS.md

            git add BUILD_STATUS.md "$ATT_FILE" .github/build-trigger
            git diff --cached --quiet && { echo "nothing to commit"; break; }
            git commit -q -m "chore(build): status${RESUME:+ + resume} (run ${{ github.run_number }})"
            git push -q origin HEAD:main && { echo "pushed"; break; }
            echo "push race, retry $attempt"; sleep $((RANDOM % 15 + 5))
          done
