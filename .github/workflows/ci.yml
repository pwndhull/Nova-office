name: CI

on:
  push:
    branches: [nova-main, main]
  pull_request:
    branches: [nova-main, main]

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  ui:
    name: UI · ${{ matrix.os }} · Node ${{ matrix.node }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
        node: ['20.11.0', '22']
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node }}
          cache: npm
      - run: npm ci
      # build:tokens runs first because every other package imports the
      # generated token artifacts.
      - run: npm run build:tokens
      - run: npm run typecheck
      - run: npm run lint
      - run: npm test
      - run: npm run build

  # ---------------------------------------------------------------------------
  # Track B — engine build. Disabled by default: needs a self-hosted runner
  # with ~50 GB disk and 8 GB RAM. Enable via the repo variable ENGINE_BUILD=1
  # once such a runner is registered. See docs/build.md.
  # ---------------------------------------------------------------------------
  engine:
    name: Engine build · ${{ matrix.os }}
    if: ${{ vars.ENGINE_BUILD == '1' }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive
      - name: Configure
        run: ./autogen.sh --with-distro=NovaOffice
      - name: Build
        run: make -j"$(nproc 2>/dev/null || sysctl -n hw.ncpu)"
      - name: Unit + filter tests (compatibility gate)
        run: make check
