# SPDX-License-Identifier: MPL-2.0
name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  experience-layer:
    name: Experience Layer (tokens, branding, checks)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - run: node scripts/build-tokens.mjs
      - run: node scripts/gen-branding.mjs
      - run: node scripts/check-no-hardcoded-branding.mjs
      - run: npm test
      - run: node scripts/check-spdx.mjs

  rust-cores:
    name: Rust cores (nova_sync_core, ycrdt, nova-cli)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
      - uses: Swatinem/rust-cache@v2
      - run: cargo fmt --all --check
      - run: cargo clippy --workspace --all-targets -- -D warnings
      - run: cargo test --workspace
      - run: cargo build --workspace --release
