# SPDX-License-Identifier: MPL-2.0
name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  experience-layer:
    name: Experience Layer (tokens, branding, checks)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: Design tokens — build + contrast gate
        run: node scripts/build-tokens.mjs

      - name: Branding — validate product.yaml + generate
        run: node scripts/gen-branding.mjs

      - name: No hardcoded branding (TRD Sec 34)
        run: node scripts/check-no-hardcoded-branding.mjs

      - name: Unit tests
        run: npm test

      - name: SPDX headers on new source
        run: node scripts/check-spdx.mjs

  rust-cores:
    name: Rust cores (nova_sync_core, …)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
      - run: cargo fmt --all --check
      - run: cargo clippy --workspace --all-targets -- -D warnings
      - run: cargo test --workspace
      - run: cargo build --workspace --release

