# SPDX-License-Identifier: MPL-2.0
#
# Full Nova-Office build for ARM64 Linux (Fedora Asahi Remix, Raspberry Pi,
# Ampere, Apple-silicon Linux) on a free GitHub-hosted `ubuntu-24.04-arm`
# runner. Native build — no emulation, no cross-compile.
#
# `ubuntu-24.04-arm` hosted runners are free only for PUBLIC repositories.
#
# Same resume-across-runs design as nova-libreoffice-build.yml (the x86_64
# build): a persistent ccache means each run compiles more than the last. It
# resumes every 2 h on a schedule, or immediately when .github/build-trigger-arm
# is pushed. State is kept in ARM-suffixed files so the two arches never
# collide.

name: Nova build (LibreOffice) · aarch64

on:
  workflow_dispatch:
  schedule:
    - cron: "47 */2 * * *" # every 2 h, offset from the x86_64 build's :17
  push:
    branches: [main]
    paths:
      - ".github/build-trigger-arm"
      - ".github/workflows/nova-libreoffice-build-aarch64.yml"

concurrency:
  group: nova-libreoffice-build-aarch64
  cancel-in-progress: false

permissions:
  contents: write

env:
  CCACHE_DIR: ${{ github.workspace }}/.ccache
  # Triggers LibreOffice's instsetoo_native packaging during `make` (belt and
  # braces with the --with-package-format=rpm configure flag).
  PKGFORMAT: rpm

jobs:
  build:
    runs-on: ubuntu-24.04-arm
    timeout-minutes: 350
    steps:
      - uses: actions/checkout@v4

      - name: Stop if already built
        id: guard
        run: |
          if [ -f .github/build-done-arm ]; then
            echo "go=false" >> "$GITHUB_OUTPUT"
            echo "aarch64 build already completed — delete .github/build-done-arm to force a rebuild."
          else
            echo "go=true" >> "$GITHUB_OUTPUT"
          fi

      - name: Confirm we are on ARM64
        if: steps.guard.outputs.go == 'true'
        run: |
          uname -m
          test "$(uname -m)" = "aarch64" || { echo "::error::runner is not aarch64 — is this repo public? free ARM runners need a public repo"; exit 1; }

      - name: Free up disk
        if: steps.guard.outputs.go == 'true'
        uses: jlumbroso/free-disk-space@main
        with: { tool-cache: true, large-packages: true, docker-images: true, swap-storage: false }

      - if: steps.guard.outputs.go == 'true'
        run: df -h /

      - uses: actions/setup-node@v4
        if: steps.guard.outputs.go == 'true'
        with: { node-version: "22" }

      - name: Install build dependencies
        if: steps.guard.outputs.go == 'true'
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            build-essential git ccache gperf python3-dev zip unzip \
            autoconf automake libtool pkg-config gettext bison flex xsltproc \
            libkrb5-dev libgtk-3-dev libgstreamer1.0-dev libgstreamer-plugins-base1.0-dev \
            libxrandr-dev libxinerama-dev libxrender-dev libxext-dev libx11-dev libxt-dev \
            libgl1-mesa-dev libglu1-mesa-dev libglm-dev \
            libxml2-dev libxml2-utils libxslt1-dev libfontconfig1-dev libcairo2-dev \
            libcups2-dev libnss3-dev libavahi-client-dev libdbus-1-dev libgpgme-dev \
            rpm
          # nasm is x86-only and not needed on aarch64.
          # rpm provides rpmbuild — LibreOffice's instsetoo_native uses it to
          # emit .rpm packages even though the runner is Debian-based.

      - name: ccache (restore)
        if: steps.guard.outputs.go == 'true'
        uses: actions/cache@v4
        with:
          path: ${{ env.CCACHE_DIR }}
          key: lo-ccache-arm-${{ github.run_id }}
          restore-keys: lo-ccache-arm-

      - name: external tarballs (restore)
        if: steps.guard.outputs.go == 'true'
        uses: actions/cache@v4
        with:
          path: ~/lo-tarballs
          key: lo-tarballs-arm-${{ hashFiles('third_party/UPSTREAM_PIN') }}
          restore-keys: lo-tarballs-arm-

      - name: ccache config
        if: steps.guard.outputs.go == 'true'
        run: |
          mkdir -p ~/lo-tarballs "$CCACHE_DIR"
          ccache -M 8G
          ccache -o compression=true
          ccache -z
          ccache --show-config | grep -E "cache_dir|max_size" || true

      - name: Fetch pinned LibreOffice
        if: steps.guard.outputs.go == 'true'
        run: ./scripts/bootstrap-upstream.sh

      - name: Apply Nova patches
        if: steps.guard.outputs.go == 'true'
        run: ./scripts/apply-patches.sh

      - name: Configure
        if: steps.guard.outputs.go == 'true'
        run: |
          node scripts/build-tokens.mjs
          node scripts/gen-branding.mjs
          ./scripts/nova-autogen.sh \
            --disable-mergelibs --enable-ccache \
            --with-parallelism=4 \
            --with-package-format=rpm \
            --with-external-tar="$HOME/lo-tarballs"
          (cd third_party/libreoffice && ./autogen.sh)

      - name: Build (time-boxed; resumes next run)
        if: steps.guard.outputs.go == 'true'
        id: build
        run: |
          cd third_party/libreoffice
          set +e
          # `make` (not `make build`) so instsetoo_native is in the graph and,
          # with --with-package-format=rpm, the .rpm set is produced once the
          # compile finishes. On a timed-out resume run it just never gets there.
          timeout 320m make -j4 > "$HOME/build.log" 2>&1
          rc=$?
          set -e
          echo "make exit: $rc  (124 = our timeout, expected on a cold run)"
          echo "----- last 120 lines -----"
          tail -n 120 "$HOME/build.log"
          echo "----- error lines -----"
          grep -nE "\bError [0-9]+\b|\*\*\* |: error:|recipe for target|No such file|cannot find|undefined reference|Segmentation fault|Killed|No space left" "$HOME/build.log" | tail -80 || true
          echo "rc=$rc" >> "$GITHUB_OUTPUT"

      - name: ccache stats
        if: steps.guard.outputs.go == 'true'
        run: ccache -s

      - name: Check result
        if: steps.guard.outputs.go == 'true'
        id: result
        run: |
          if [ -x third_party/libreoffice/instdir/program/soffice.bin ]; then
            echo "done=true" >> "$GITHUB_OUTPUT"
            third_party/libreoffice/instdir/program/soffice.bin --version || true
          else
            echo "done=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Build .rpm packages
        if: steps.result.outputs.done == 'true'
        continue-on-error: true # a packaging failure must not lose the portable build
        run: |
          # RPM packaging needs a buildroot and the runner is disk-tight, so
          # reclaim ccache's ~8 GB — but only when we're actually about to
          # package. This costs a cold rebuild if build-done-arm is ever
          # removed, which is the accepted trade on a 45 GB runner.
          ccache -C || true
          df -h /
          cd third_party/libreoffice
          # If the compile finished this run, `make` above already produced the
          # packages. If it finished on an earlier run (instdir cached, restart
          # skipped straight past), force the packaging module now.
          if ! find workdir/installation -name '*.rpm' -print -quit | grep -q .; then
            echo "no .rpm yet — running instsetoo_native"
            timeout 40m make instsetoo_native -j4 2>&1 | tail -n 80
          fi
          echo "----- rpm inventory -----"
          find workdir/installation -name '*.rpm' | sort

      - name: Collect installables
        if: steps.result.outputs.done == 'true'
        id: collect
        run: |
          cd third_party/libreoffice
          mkdir -p "$GITHUB_WORKSPACE/dist/rpms"
          # 1. every .rpm produced, flattened into one dir
          n=0
          while IFS= read -r f; do
            cp "$f" "$GITHUB_WORKSPACE/dist/rpms/" && n=$((n+1))
          done < <(find workdir/installation -name '*.rpm')
          if [ "$n" -gt 0 ]; then
            tar -C "$GITHUB_WORKSPACE/dist" -czf "$GITHUB_WORKSPACE/dist/nova-office-linux-aarch64-rpm.tar.gz" rpms
            rm -rf "$GITHUB_WORKSPACE/dist/rpms"
            echo "rpms=true" >> "$GITHUB_OUTPUT"
            echo "Packaged $n rpm(s)"
          else
            rm -rf "$GITHUB_WORKSPACE/dist/rpms"
            echo "rpms=false" >> "$GITHUB_OUTPUT"
            echo "::warning::no .rpm produced — shipping the portable tree only"
          fi
          # 2. always also ship the portable instdir (extract & run, no root)
          tar -C instdir -czf "$GITHUB_WORKSPACE/dist/nova-office-linux-aarch64-portable.tar.gz" .
          ls -la "$GITHUB_WORKSPACE/dist"

      - name: Upload make log
        if: steps.guard.outputs.go == 'true' && always()
        uses: actions/upload-artifact@v4
        with:
          name: make-log-arm-${{ github.run_number }}
          path: ~/build.log
          retention-days: 7
          if-no-files-found: warn

      - name: Write INSTALL.md
        if: steps.result.outputs.done == 'true'
        run: |
          cat > dist/INSTALL.md <<'EOF'
          # Nova-Office — aarch64 Linux

          Two forms in this download:

          ## nova-office-linux-aarch64-rpm.tar.gz  — install with dnf (Fedora / Asahi)
          ```
          tar xzf nova-office-linux-aarch64-rpm.tar.gz
          sudo dnf install ./rpms/*.rpm
          ```
          Installs under /opt, adds the launcher entries. Remove with
          `sudo dnf remove $(rpm -qa | grep -i nova)`.

          ## nova-office-linux-aarch64-portable.tar.gz  — no install, no root
          ```
          tar xzf nova-office-linux-aarch64-portable.tar.gz
          ./program/soffice
          ```
          EOF

      - name: Upload Nova-Office build
        if: steps.result.outputs.done == 'true'
        uses: actions/upload-artifact@v4
        with:
          name: nova-office-linux-aarch64
          path: dist/*
          retention-days: 14
          if-no-files-found: error

      - name: Status + attempt counter
        if: always()
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -x
          DONE='${{ steps.result.outputs.done }}'
          GUARD='${{ steps.guard.outputs.go }}'
          CC="$(ccache -s 2>/dev/null | sed -n '1,10p' || true)"
          git config user.name "nova-build[bot]"
          git config user.email "nova-build@users.noreply.github.com"
          for attempt in 1 2 3 4 5 6; do
            git fetch -q origin main && git reset -q --hard origin/main
            ATT=$(tr -dc 0-9 < .github/build-attempts-arm 2>/dev/null); ATT=${ATT:-0}
            NOTE="⏳ Not finished — resumes on the 2-hourly schedule (or push .github/build-trigger-arm)."
            if [ "$DONE" = "true" ]; then
              echo 0 > .github/build-attempts-arm
              date -u '+built %Y-%m-%dT%H:%M:%SZ' > .github/build-done-arm
              NOTE="✅ **aarch64 build complete.** Download \`nova-office-linux-aarch64\` from [run #${{ github.run_number }}](${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }})."
            elif [ "$GUARD" = "true" ]; then
              ATT=$((ATT + 1)); echo "$ATT" > .github/build-attempts-arm
              [ "$ATT" -ge 20 ] && NOTE="> ⚠️ 20 resume attempts — needs a human look."
            fi
            {
              echo "<!-- SPDX-License-Identifier: MPL-2.0 -->"
              echo "# Nova-Office LibreOffice build (aarch64) — status"
              echo
              echo "- Last run: [#${{ github.run_number }}](${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}) — $(date -u '+%Y-%m-%d %H:%M UTC')"
              echo "- Build completed: **${DONE:-false}**   ·   resume attempts: ${ATT}/20"
              echo
              echo '```'; echo "$CC"; echo '```'
              echo; echo "$NOTE"
            } > BUILD_STATUS_ARM.md
            git add BUILD_STATUS_ARM.md .github/build-attempts-arm .github/build-done-arm 2>/dev/null || git add BUILD_STATUS_ARM.md .github/build-attempts-arm
            git diff --cached --quiet && { echo "nothing to commit"; break; }
            git commit -q -m "chore(build): aarch64 status (run ${{ github.run_number }}, done=${DONE:-false})"
            git push -q origin HEAD:main && { echo pushed; break; }
            sleep $((RANDOM % 15 + 5))
          done
