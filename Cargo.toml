# SPDX-License-Identifier: MPL-2.0
# Rust workspace for the Nova Experience Layer's native crates. These build as
# static libs and link into the C++ nova_* modules via C ABIs (see
# docs/architecture.md §10). The LibreOffice submodule is NOT part of this
# workspace.
[workspace]
resolver = "2"
members = [
    "nova/nova_sync/nova_sync_core",
    # "nova/nova_notes/ycrdt",   # TODO Phase 5 — Y-CRDT wrapper (ADR-0003)
]

[workspace.package]
edition = "2021"
license = "MPL-2.0"
repository = "https://example.org/nova"
