# SPDX-License-Identifier: MPL-2.0
[package]
name = "nova_sync_core"
version = "0.1.0"
edition = "2021"
license = "MPL-2.0"
description = "Nova-Office sync primitives: NovaSyncEnvelope codec, integrity, retry/backoff. Linked into nova_sync (C++) via a C ABI."
repository = "https://example.org/nova"
publish = false

[lib]
crate-type = ["rlib", "staticlib"]

[dependencies]
sha2 = "0.10"
serde = { version = "1", features = ["derive"] }
serde_json = "1"

[profile.release]
opt-level = 3
lto = true
codegen-units = 1
panic = "abort"
